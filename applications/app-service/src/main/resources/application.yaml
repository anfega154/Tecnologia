#    username: "${SPRING_R2DBC_USERNAME:postgres}"
#    password: "${SPRING_R2DBC_PASSWORD:postgres}"

routers:
  paths:
    technologies: "/api/v1/tecnologias"

adapters:
  r2dbc:
    host: "localhost"
    port: "5432"
    database: "tecnologia"
    schema: "public"
    username: "postgres"
    password: "postgres"